[project]
name = "mychatbot"
version = "0.1.0"
description = "LangGraph chatbot with long-term memory and MCP tools"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "python-dotenv",
  "pydantic",
  "requests",
  "langchain",
  "langchain-core",
  "langchain-community",
  "langchain-groq",
  "langgraph",
  "langgraph-checkpoint-sqlite",
  "langgraph-checkpoint-postgres",
  "langchain-mcp-adapters",
  "mcp>=1.24,<2",
  "psycopg[binary]",
  "aiosqlite",
  "sentence-transformers",
  "tavily-python",
]

[dependency-groups]
dev = [
  "pytest",
  "pytest-asyncio",
  "httpx",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
